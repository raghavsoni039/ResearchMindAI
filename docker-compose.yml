services:
  # ---------------------------------------------------------------------------
  # FastAPI Backend (Python 3.11 + Gunicorn + Uvicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchmind-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-gemini-3.5-flash}
      - TEMPERATURE=${TEMPERATURE:-0.2}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-4096}
      - UPLOAD_DIR=app/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-50}
      - CHROMA_DB_PATH=./chroma_db
      - APP_NAME=ResearchMind AI
      - APP_VERSION=1.0.0
      - AUTH_SECRET=${AUTH_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      - backend_uploads:/app/app/uploads
      - backend_chromadb:/app/chroma_db
      - backend_chathistory:/app/storage/chat_history
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Next.js Frontend (App Router + Auth.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: researchmind-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=${NEXTAUTH_URL:-}
      - AUTH_URL=${NEXTAUTH_URL:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID:-}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads:
  backend_chromadb:
  backend_chathistory:
